<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAR DANK | CASHIER & HISTORY</title>
<style>
    :root {
        --bg: #0b0b0d;
        --card: #151518;
        --card-light: #1d1d21;
        --gold: #d4af5a;
        --gold-light: #f0d58a;
        --text: #f5f5f5;
        --sub: #a8a8ad;
        --border: #303036;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px 14px 40px;
        background: radial-gradient(circle at top, #242018 0%, #0b0b0d 38%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    }
    .container { width: 100%; max-width: 520px; margin: auto; }
    .header { text-align: center; margin: 10px 0 28px; }
    .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.2rem;
        font-weight: bold;
        letter-spacing: 0.16em;
        color: var(--gold-light);
    }
    .cashier {
        margin-top: 5px;
        font-size: 0.85rem;
        letter-spacing: 0.45em;
        color: var(--sub);
    }
    .line { width: 55px; height: 2px; background: var(--gold); margin: 15px auto 0; }
    .card {
        background: rgba(21, 21, 24, 0.95);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px 18px;
        margin-bottom: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 17px;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.15em;
        color: var(--gold-light);
    }
    .section-title::before {
        content: "";
        display: block;
        width: 4px;
        height: 20px;
        background: var(--gold);
        border-radius: 4px;
    }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 7px; font-size: 1rem; color: #d8d8dc; }
    input, select {
        width: 100%;
        height: 54px;
        padding: 8px 14px;
        border-radius: 11px;
        border: 1px solid #3a3a40;
        background: var(--card-light);
        color: white;
        font-size: 1.2rem;
        font-weight: 600;
        text-align: right;
        outline: none;
    }
    input[type="text"] { text-align: left; }
    input:focus, select:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(212,175,90,0.15);
    }
    select { text-align: left; font-size: 1.05rem; }
    
    .bottle-row {
        background: rgba(29, 29, 33, 0.6);
        border: 1px solid #2a2a30;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
    }
    .bottle-row-title {
        font-size: 0.8rem;
        color: var(--gold);
        letter-spacing: 0.1em;
        margin-bottom: 8px;
        font-weight: bold;
    }
    .bottle-inputs { display: flex; gap: 10px; }
    .bottle-inputs > div { flex: 1; }
    .bottle-inputs label { font-size: 0.8rem; margin-bottom: 4px; color: var(--sub); }
    .bottle-inputs select { height: 44px; font-size: 0.95rem; }

    .result-card {
        background: linear-gradient(145deg, #1c1b17, #111113);
        border: 1px solid #4b4027;
        border-radius: 18px;
        padding: 22px 20px;
        box-shadow: 0 12px 35px rgba(0,0,0,0.45);
    }
    .result-title {
        text-align: center;
        color: var(--gold-light);
        font-size: 0.85rem;
        letter-spacing: 0.25em;
        margin-bottom: 18px;
    }
    .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        font-size: 0.95rem;
        color: #b8b8bc;
    }
    .amount { font-weight: 600; color: white; }
    .breakdown-section {
        border-bottom: 1px solid #302d24;
        padding-bottom: 10px;
        margin-bottom: 10px;
    }
    .total-row {
        margin-top: 12px;
        padding-top: 14px;
        border-top: 1px solid #4a463b;
    }
    .total-label { font-size: 1.15rem; font-weight: bold; color: white; }
    .total-amount {
        font-size: 2rem;
        font-weight: 800;
        color: var(--gold-light);
    }
    .split-row {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #4a463b;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1rem;
        color: var(--gold-light);
        font-weight: bold;
    }
    .btn-container {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    .btn-action {
        flex: 1;
        height: 54px;
        border-radius: 14px;
        border: none;
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn-save {
        background: linear-gradient(135deg, var(--gold), #b89742);
        color: #111;
        box-shadow: 0 6px 20px rgba(212,175,90,0.3);
    }
    .btn-excel {
        background: linear-gradient(135deg, #2e7d32, #1b5e20);
        color: white;
        box-shadow: 0 6px 20px rgba(46,125,50,0.3);
    }
    .btn-action:hover { opacity: 0.9; }

    .history-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        margin-top: 20px;
    }
    .history-list {
        max-height: 180px;
        overflow-y: auto;
        font-size: 0.85rem;
        color: var(--sub);
    }
    .history-item {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #25252b;
    }

    .footer {
        text-align: center;
        margin-top: 22px;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        color: #66666c;
    }

    @media print {
        body { background: white; color: black; padding: 0; }
        .card, .result-card, .history-card { background: white; border: 1px solid #ccc; box-shadow: none; color: black; }
        input, select { background: white; color: black; border: 1px solid #ccc; }
        .btn-container, .history-card { display: none; }
        .brand, .section-title, .total-amount, .split-row { color: #000 !important; }
    }
</style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="brand">BAR DANK</div>
        <div class="cashier">CASHIER & HISTORY</div>
        <div class="line"></div>
    </header>

    <div class="card">
        <div class="section-title">CUSTOMER</div>
        <div class="input-group">
            <label for="customerName">お客様名</label>
            <input type="text" id="customerName" placeholder="お名前を入力" oninput="calculate()">
        </div>
    </div>

    <div class="card">
        <div class="section-title">PRICE SETTING</div>
        <div class="input-group">
            <label for="chargePrice">チャージ単価</label>
            <input type="number" id="chargePrice" value="1000" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="singlePrice">単品単価</label>
            <input type="number" id="singlePrice" value="800" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="shotPrice">ショット単価</label>
            <input type="number" id="shotPrice" value="1000" oninput="calculate()">
        </div>
    </div>

    <div class="card">
        <div class="section-title">ORDER</div>
        <div class="input-group">
            <label for="customers">人数</label>
            <input type="number" id="customers" min="0" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="singleCount">単品 杯数</label>
            <input type="number" id="singleCount" min="0" placeholder="0" oninput="calculate()">
        </div>
        <div class="input-group">
            <label for="shotCount">ショット 杯数</label>
            <input type="number" id="shotCount" min="0" placeholder="0" oninput="calculate()">
        </div>

        <div class="section-title" style="margin-top: 24px; font-size: 0.85rem;">BOTTLE ORDERS</div>

        <!-- ボトル1〜6 (0なし) -->
        <div class="bottle-row">
            <div class="bottle-row-title">BOTTLE 1</div>
            <div class="bottle-inputs">
                <div>
                    <label>単価</label>
                    <select id="bottlePrice1" class="bottle-price" onchange="calculate()">
                        <option value="0">選択なし</option>
                    </select>
                </div>
                <div>
                    <label>本数</label>
                    <select id="bottleCount1" class="bottle-count" onchange="calculate()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bottle-row">
            <div class="bottle-row-title">BOTTLE 2</div>
            <div class="bottle-inputs">
                <div>
                    <label>単価</label>
                    <select id="bottlePrice2" class="bottle-price" onchange="calculate()">
                        <option value="0">選択なし</option>
                    </select>
                </div>
                <div>
                    <label>本数</label>
                    <select id="bottleCount2" class="bottle-count" onchange="calculate()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bottle-row">
            <div class="bottle-row-title">BOTTLE 3</div>
            <div class="bottle-inputs">
                <div>
                    <label>単価</label>
                    <select id="bottlePrice3" class="bottle-price" onchange="calculate()">
                        <option value="0">選択なし</option>
                    </select>
                </div>
                <div>
                    <label>本数</label>
                    <select id="bottleCount3" class="bottle-count" onchange="calculate()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bottle-row">
            <div class="bottle-row-title">BOTTLE 4</div>
            <div class="bottle-inputs">
                <div>
                    <label>単価</label>
                    <select id="bottlePrice4" class="bottle-price" onchange="calculate()">
                        <option value="0">選択なし</option>
                    </select>
                </div>
                <div>
                    <label>本数</label>
                    <select id="bottleCount4" class="bottle-count" onchange="calculate()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bottle-row">
            <div class="bottle-row-title">BOTTLE 5</div>
            <div class="bottle-inputs">
                <div>
                    <label>単価</label>
                    <select id="bottlePrice5" class="bottle-price" onchange="calculate()">
                        <option value="0">選択なし</option>
                    </select>
                </div>
                <div>
                    <label>本数</label>
                    <select id="bottleCount5" class="bottle-count" onchange="calculate()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bottle-row">
            <div class="bottle-row-title">BOTTLE 6</div>
            <div class="bottle-inputs">
                <div>
                    <label>単価</label>
                    <select id="bottlePrice6" class="bottle-price" onchange="calculate()">
                        <option value="0">選択なし</option>
                    </select>
                </div>
                <div>
                    <label>本数</label>
                    <select id="bottleCount6" class="bottle-count" onchange="calculate()">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="result-card">
        <div class="result-title" id="summaryTitle">BILL SUMMARY & BREAKDOWN</div>
        <div class="breakdown-section" id="breakdownContainer">
            <!-- 動的に内訳を表示 -->
        </div>
        <div class="result-row">
            <span>小計</span>
            <span class="amount" id="subtotal">¥0</span>
        </div>
        <div class="result-row">
            <span>TAX 10%</span>
            <span class="amount" id="tax">¥0</span>
        </div>
        <div class="result-row total-row">
            <span class="total-label">TOTAL</span>
            <span class="total-amount" id="total">¥0</span>
        </div>
        <div class="split-row" id="splitRow" style="display: none;">
            <span>お一人様あたり (割勘)</span>
            <span id="splitAmount">¥0</span>
        </div>
    </div>

    <div class="btn-container">
        <button class="btn-action btn-save" onclick="recordAndPrint()">PDF / 印刷 & 記録</button>
        <button class="btn-action btn-excel" onclick="exportExcel()">Excel (CSV) 保存</button>
    </div>

    <div class="history-card">
        <div class="section-title" style="margin-bottom: 10px; font-size: 0.85rem;">売上履歴 (自動蓄積)</div>
        <div class="history-list" id="historyList">
            <div style="text-align: center; color: #555;">履歴はまだありません</div>
        </div>
    </div>

    <div class="footer">BAR DANK · CASHIER SYSTEM</div>
</div>

<script>
    let currentTotal = 0;

    window.onload = function () {
        const priceSelects = document.querySelectorAll(".bottle-price");
        priceSelects.forEach(select => {
            for (let price = 10000; price <= 100000; price += 5000) {
                const option = document.createElement("option");
                option.value = price;
                option.textContent = price.toLocaleString();
                select.appendChild(option);
            }
        });
        loadHistory();
        calculate();
    };

    function calculate() {
        const customerName = document.getElementById("customerName").value.trim();
        const chargePrice = parseInt(document.getElementById("chargePrice").value) || 0;
        const singlePrice = parseInt(document.getElementById("singlePrice").value) || 0;
        const shotPrice = parseInt(document.getElementById("shotPrice").value) || 0;
        const customers = parseInt(document.getElementById("customers").value) || 0;
        const singleCount = parseInt(document.getElementById("singleCount").value) || 0;
        const shotCount = parseInt(document.getElementById("shotCount").value) || 0;

        if (customerName) {
            document.getElementById("summaryTitle").textContent = `BILL SUMMARY - ${customerName}様`;
        } else {
            document.getElementById("summaryTitle").textContent = "BILL SUMMARY & BREAKDOWN";
        }

        const chargeSub = customers * chargePrice;
        const singleSub = singleCount * singlePrice;
        const shotSub = shotCount * shotPrice;

        let breakdownHTML = "";
        if (chargeSub > 0) {
            breakdownHTML += `<div class="result-row"><span>チャージ (${customers}名 × ¥${chargePrice.toLocaleString()})</span><span class="amount">¥${chargeSub.toLocaleString()}</span></div>`;
        }
        if (singleSub > 0) {
            breakdownHTML += `<div class="result-row"><span>単品 (${singleCount}杯 × ¥${singlePrice.toLocaleString()})</span><span class="amount">¥${singleSub.toLocaleString()}</span></div>`;
        }
        if (shotSub > 0) {
            breakdownHTML += `<div class="result-row"><span>ショット (${shotCount}杯 × ¥${shotPrice.toLocaleString()})</span><span class="amount">¥${shotSub.toLocaleString()}</span></div>`;
        }

        let bottleSub = 0;
        for (let i = 1; i <= 6; i++) {
            const bPrice = parseInt(document.getElementById("bottlePrice" + i).value) || 0;
            const bCount = parseInt(document.getElementById("bottleCount" + i).value) || 0;
            if (bPrice > 0 && bCount > 0) {
                const bTotal = bPrice * bCount;
                bottleSub += bTotal;
                breakdownHTML += `<div class="result-row"><span>ボトル ${i} (¥${bPrice.toLocaleString()} × ${bCount})</span><span class="amount">¥${bTotal.toLocaleString()}</span></div>`;
            }
        }

        if (breakdownHTML === "") {
            breakdownHTML = `<div class="result-row" style="color: #666; justify-content: center;"><span>明細なし</span></div>`;
        }

        document.getElementById("breakdownContainer").innerHTML = breakdownHTML;

        const subtotal = chargeSub + singleSub + shotSub + bottleSub;
        const tax = Math.round(subtotal * 0.10);
        currentTotal = subtotal + tax;

        document.getElementById("subtotal").textContent = "¥" + subtotal.toLocaleString();
        document.getElementById("tax").textContent = "¥" + tax.toLocaleString();
        document.getElementById("total").textContent = "¥" + currentTotal.toLocaleString();

        const splitRow = document.getElementById("splitRow");
        if (customers > 1 && currentTotal > 0) {
            const splitAmount = Math.round(currentTotal / customers);
            document.getElementById("splitAmount").textContent = "¥" + splitAmount.toLocaleString();
            splitRow.style.display = "flex";
        } else {
            splitRow.style.display = "none";
        }
    }

    function recordAndPrint() {
        saveHistory();
        window.print();
    }

    function saveHistory() {
        const customerName = document.getElementById("customerName").value.trim() || "一般のお客様";
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        if (currentTotal <= 0) return;

        const record = {
            time: timeStr,
            name: customerName,
            total: currentTotal
        };

        let history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        history.unshift(record); // 最新を先頭に
        if (history.length > 50) history = history.slice(0, 50); // 最大50件保持
        localStorage.setItem("bar_dank_history", JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        const listEl = document.getElementById("historyList");
        if (history.length === 0) {
            listEl.innerHTML = `<div style="text-align: center; color: #555;">履歴はまだありません</div>`;
            return;
        }
        let html = "";
        history.forEach(item => {
            html += `<div class="history-item"><span>${item.time} - ${item.name}様</span><span style="color:var(--gold-light)">¥${item.total.toLocaleString()}</span></div>`;
        });
        listEl.innerHTML = html;
    }

    function exportExcel() {
        const history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        if (history.length === 0) {
            alert("エクスポートする履歴がありません。");
            return;
        }

        let csv = "日時,お客様名,合計金額\n";
        history.forEach(item => {
            csv += `"${item.time}","${item.name}",${item.total}\n`;
        });

        // BOM付与でExcelでの文字化け防止
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bardank_sales_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
