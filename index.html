<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAR DANK | CASHIER & HISTORY</title>
<style>
    :root {
        --bg: #0b0b0d;
        --card: #151518;
        --card-light: #1d1d21;
        --gold: #d4af5a;
        --gold-light: #f0d58a;
        --text: #f5f5f5;
        --sub: #a8a8ad;
        --border: #303036;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 20px 14px 40px;
        background: radial-gradient(circle at top, #242018 0%, #0b0b0d 38%);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    }
    .container { width: 100%; max-width: 520px; margin: auto; }
    .header { text-align: center; margin: 10px 0 20px; }
    .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.2rem;
        font-weight: bold;
        letter-spacing: 0.16em;
        color: var(--gold-light);
    }
    .cashier {
        margin-top: 5px;
        font-size: 0.85rem;
        letter-spacing: 0.45em;
        color: var(--sub);
    }
    .line { width: 55px; height: 2px; background: var(--gold); margin: 15px auto 0; }

    /* タブ切り替えエリア */
    .tabs-container {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 16px;
    }
    .tab-item {
        background: #1a1a1f;
        border: 1px solid var(--border);
        color: var(--sub);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
    }
    .tab-item.active {
        background: var(--gold);
        color: #111;
        border-color: var(--gold);
    }
    .tab-close {
        font-size: 0.7rem;
        padding: 2px 5px;
        border-radius: 50%;
        background: rgba(0,0,0,0.2);
    }
    .tab-item.active .tab-close { background: rgba(0,0,0,0.15); }
    .tab-add-btn {
        background: transparent;
        border: 1px dashed var(--gold);
        color: var(--gold);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
    }
    .tab-add-btn:hover { background: rgba(212,175,90,0.1); }

    .card {
        background: rgba(21, 21, 24, 0.95);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px 18px;
        margin-bottom: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .section-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 17px;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.15em;
        color: var(--gold-light);
    }
    .section-title::before {
        content: "";
        display: block;
        width: 4px;
        height: 20px;
        background: var(--gold);
        border-radius: 4px;
    }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 7px; font-size: 1rem; color: #d8d8dc; }
    input, select {
        width: 100%;
        height: 54px;
        padding: 8px 14px;
        border-radius: 11px;
        border: 1px solid #3a3a40;
        background: var(--card-light);
        color: white;
        font-size: 1.2rem;
        font-weight: 600;
        text-align: right;
        outline: none;
    }
    input[type="text"] { text-align: left; }
    input:focus, select:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(212,175,90,0.15);
    }
    select { text-align: left; font-size: 1.05rem; }
    
    .bottle-row {
        background: rgba(29, 29, 33, 0.6);
        border: 1px solid #2a2a30;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
    }
    .bottle-row-title {
        font-size: 0.8rem;
        color: var(--gold);
        letter-spacing: 0.1em;
        margin-bottom: 8px;
        font-weight: bold;
    }
    .bottle-inputs { display: flex; gap: 10px; }
    .bottle-inputs > div { flex: 1; }
    .bottle-inputs label { font-size: 0.8rem; margin-bottom: 4px; color: var(--sub); }
    .bottle-inputs select { height: 44px; font-size: 0.95rem; }

    .result-card {
        background: linear-gradient(145deg, #1c1b17, #111113);
        border: 1px solid #4b4027;
        border-radius: 18px;
        padding: 22px 20px;
        box-shadow: 0 12px 35px rgba(0,0,0,0.45);
    }
    .result-title {
        text-align: center;
        color: var(--gold-light);
        font-size: 0.85rem;
        letter-spacing: 0.25em;
        margin-bottom: 18px;
    }
    .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        font-size: 0.95rem;
        color: #b8b8bc;
    }
    .amount { font-weight: 600; color: white; }
    .breakdown-section {
        border-bottom: 1px solid #302d24;
        padding-bottom: 10px;
        margin-bottom: 10px;
    }
    .total-row {
        margin-top: 12px;
        padding-top: 14px;
        border-top: 1px solid #4a463b;
    }
    .total-label { font-size: 1.15rem; font-weight: bold; color: white; }
    .total-amount {
        font-size: 2rem;
        font-weight: 800;
        color: var(--gold-light);
    }
    .split-row {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #4a463b;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1rem;
        color: var(--gold-light);
        font-weight: bold;
    }
    .btn-container {
        margin-top: 20px;
    }
    .btn-action {
        width: 100%;
        height: 54px;
        border-radius: 14px;
        border: none;
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn-save {
        background: linear-gradient(135deg, var(--gold), #b89742);
        color: #111;
        box-shadow: 0 6px 20px rgba(212,175,90,0.3);
    }
    .btn-action:hover { opacity: 0.9; }

    .history-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        margin-top: 20px;
    }
    .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    .history-btn-group {
        display: flex;
        gap: 6px;
    }
    .history-sub-btn {
        background: transparent;
        border: 1px solid var(--gold);
        color: var(--gold-light);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .history-sub-btn:hover {
        background: rgba(212,175,90,0.15);
    }
    .history-clear-all-btn {
        background: transparent;
        border: 1px solid #ff6b6b;
        color: #ff6b6b;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }
    .history-clear-all-btn:hover {
        background: #ff6b6b;
        color: white;
    }
    .history-list {
        max-height: 200px;
        overflow-y: auto;
        font-size: 0.85rem;
        color: var(--sub);
    }
    .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #25252b;
    }
    .history-info {
        display: flex;
        gap: 10px;
        align-items: center;
        overflow: hidden;
    }
    .history-delete-btn {
        background: #2a2a32;
        border: 1px solid #44444f;
        color: #ff6b6b;
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: background 0.2s;
        flex-shrink: 0;
    }
    .history-delete-btn:hover {
        background: #3a2a2a;
        border-color: #ff6b6b;
    }

    .footer {
        text-align: center;
        margin-top: 22px;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        color: #66666c;
    }
</style>
</head>
<body>

<script>
    let currentTotal = 0;
    const EXPIRATION_HOURS = 48;

    let sessions = [];
    let activeSessionId = null;

    window.onload = function () {
        const priceSelects = document.querySelectorAll(".bottle-price");
        priceSelects.forEach(select => {
            for (let price = 10000; price <= 100000; price += 5000) {
                const option = document.createElement("option");
                option.value = price;
                option.textContent = price.toLocaleString();
                select.appendChild(option);
            }
        });

        let savedSessions = localStorage.getItem("bar_dank_sessions");
        if (savedSessions) {
            try {
                sessions = JSON.parse(savedSessions);
            } catch(e) { sessions = []; }
        }
        
        if (!sessions || sessions.length === 0) {
            addNewSession();
        } else {
            activeSessionId = sessions[0].id;
        }

        renderTabs();
        loadFormData();
        loadHistory();
        calculate();
    };

    function createEmptySessionData() {
        return {
            id: 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
            customerName: "",
            chargePrice: 1000,
            singlePrice: 800,
            shotPrice: 1000,
            customers: "",
            singleCount: "",
            shotCount: "",
            bottles: [
                {price: 0, count: 0},
                {price: 0, count: 0},
                {price: 0, count: 0},
                {price: 0, count: 0},
                {price: 0, count: 0},
                {price: 0, count: 0}
            ]
        };
    }

    function addNewSession() {
        const newSess = createEmptySessionData();
        sessions.push(newSess);
        activeSessionId = newSess.id;
        saveSessionsStorage();
        renderTabs();
        loadFormData();
        calculate();
    }

    function switchSession(id) {
        updateCurrentData();
        activeSessionId = id;
        saveSessionsStorage();
        renderTabs();
        loadFormData();
        calculate();
    }

    function closeSession(id, event) {
        event.stopPropagation();
        if (sessions.length <= 1) {
            alert("最後のタブは削除できません。");
            return;
        }
        if (!confirm("この会計画面を閉じますか？（入力中の未保存データは消えます）")) {
            return;
        }
        
        sessions = sessions.filter(s => s.id !== id);
        if (activeSessionId === id) {
            activeSessionId = sessions[0].id;
        }
        saveSessionsStorage();
        renderTabs();
        loadFormData();
        calculate();
    }

    function saveSessionsStorage() {
        localStorage.setItem("bar_dank_sessions", JSON.stringify(sessions));
    }

    function updateCurrentData() {
        const sess = sessions.find(s => s.id === activeSessionId);
        if (!sess) return;

        sess.customerName = document.getElementById("customerName").value;
        sess.chargePrice = document.getElementById("chargePrice").value;
        sess.singlePrice = document.getElementById("singlePrice").value;
        sess.shotPrice = document.getElementById("shotPrice").value;
        sess.customers = document.getElementById("customers").value;
        sess.singleCount = document.getElementById("singleCount").value;
        sess.shotCount = document.getElementById("shotCount").value;

        for (let i = 1; i <= 6; i++) {
            sess.bottles[i-1].price = document.getElementById("bottlePrice" + i).value;
            sess.bottles[i-1].count = document.getElementById("bottleCount" + i).value;
        }
        saveSessionsStorage();
    }

    function loadFormData() {
        const sess = sessions.find(s => s.id === activeSessionId);
        if (!sess) return;

        document.getElementById("customerName").value = sess.customerName || "";
        document.getElementById("chargePrice").value = sess.chargePrice ?? 1000;
        document.getElementById("singlePrice").value = sess.singlePrice ?? 800;
        document.getElementById("shotPrice").value = sess.shotPrice ?? 1000;
        document.getElementById("customers").value = sess.customers || "";
        document.getElementById("singleCount").value = sess.singleCount || "";
        document.getElementById("shotCount").value = sess.shotCount || "";

        for (let i = 1; i <= 6; i++) {
            document.getElementById("bottlePrice" + i).value = sess.bottles[i-1].price || 0;
            document.getElementById("bottleCount" + i).value = sess.bottles[i-1].count || 0;
        }
    }

    function renderTabs() {
        const container = document.getElementById("tabsContainer");
        let html = "";
        sessions.forEach((sess, idx) => {
            const isActive = sess.id === activeSessionId;
            let label = sess.customerName ? `${sess.customerName}様` : `新規お客様 ${idx + 1}`;
            html += `
                <div class="tab-item ${isActive ? 'active' : ''}" onclick="switchSession('${sess.id}')">
                    <span>${label}</span>
                    <span class="tab-close" onclick="closeSession('${sess.id}', event)">✕</span>
                </div>
            `;
        });
        html += `<button class="tab-add-btn" onclick="addNewSession()">＋ 追加</button>`;
        container.innerHTML = html;
    }

    function calculate() {
        const customerName = document.getElementById("customerName").value.trim();
        const chargePrice = parseInt(document.getElementById("chargePrice").value) || 0;
        const singlePrice = parseInt(document.getElementById("singlePrice").value) || 0;
        const shotPrice = parseInt(document.getElementById("shotPrice").value) || 0;
        const customers = parseInt(document.getElementById("customers").value) || 0;
        const singleCount = parseInt(document.getElementById("singleCount").value) || 0;
        const shotCount = parseInt(document.getElementById("shotCount").value) || 0;

        if (customerName) {
            document.getElementById("summaryTitle").textContent = `BILL SUMMARY - ${customerName}様`;
        } else {
            document.getElementById("summaryTitle").textContent = "BILL SUMMARY & BREAKDOWN";
        }

        const chargeSub = customers * chargePrice;
        const singleSub = singleCount * singlePrice;
        const shotSub = shotCount * shotPrice;

        let breakdownHTML = "";
        if (chargeSub > 0) {
            breakdownHTML += `<div class="result-row"><span>チャージ (${customers}名 × ¥${chargePrice.toLocaleString()})</span><span class="amount">¥${chargeSub.toLocaleString()}</span></div>`;
        }
        if (singleSub > 0) {
            breakdownHTML += `<div class="result-row"><span>単品 (${singleCount}杯 × ¥${singlePrice.toLocaleString()})</span><span class="amount">¥${singleSub.toLocaleString()}</span></div>`;
        }
        if (shotSub > 0) {
            breakdownHTML += `<div class="result-row"><span>ショット (${shotCount}杯 × ¥${shotPrice.toLocaleString()})</span><span class="amount">¥${shotSub.toLocaleString()}</span></div>`;
        }

        let bottleSub = 0;
        for (let i = 1; i <= 6; i++) {
            const bPrice = parseInt(document.getElementById("bottlePrice" + i).value) || 0;
            const bCount = parseInt(document.getElementById("bottleCount" + i).value) || 0;
            if (bPrice > 0 && bCount > 0) {
                const bTotal = bPrice * bCount;
                bottleSub += bTotal;
                breakdownHTML += `<div class="result-row"><span>ボトル ${i} (¥${bPrice.toLocaleString()} × ${bCount})</span><span class="amount">¥${bTotal.toLocaleString()}</span></div>`;
            }
        }

        if (breakdownHTML === "") {
            breakdownHTML = `<div class="result-row" style="color: #666; justify-content: center;"><span>明細なし</span></div>`;
        }

        document.getElementById("breakdownContainer").innerHTML = breakdownHTML;

        const subtotal = chargeSub + singleSub + shotSub + bottleSub;
        const tax = Math.round(subtotal * 0.10);
        currentTotal = subtotal + tax;

        document.getElementById("subtotal").textContent = "¥" + subtotal.toLocaleString();
        document.getElementById("tax").textContent = "¥" + tax.toLocaleString();
        document.getElementById("total").textContent = "¥" + currentTotal.toLocaleString();

        const splitRow = document.getElementById("splitRow");
        if (customers > 1 && currentTotal > 0) {
            const splitAmount = Math.round(currentTotal / customers);
            document.getElementById("splitAmount").textContent = "¥" + splitAmount.toLocaleString();
            splitRow.style.display = "flex";
        } else {
            splitRow.style.display = "none";
        }

        renderTabs();
    }

    function saveOnly() {
        updateCurrentData();
        const customerName = document.getElementById("customerName").value.trim();
        
        if (!customerName) {
            alert("お客様名を入力してください。（名前がないと記録できません）");
            document.getElementById("customerName").focus();
            return;
        }

        if (currentTotal <= 0) {
            alert("合計金額が0円です。");
            return;
        }

        saveHistory();
        alert(customerName + "様のご注文を売上保存しました。");

        if (sessions.length > 1) {
            const targetId = activeSessionId;
            sessions = sessions.filter(s => s.id !== targetId);
            activeSessionId = sessions[0].id;
        } else {
            sessions[0] = createEmptySessionData();
        }

        saveSessionsStorage();
        renderTabs();
        loadFormData();
        calculate();
    }

    function saveHistory() {
        const customerName = document.getElementById("customerName").value.trim();
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        const record = {
            id: now.getTime() + "_" + Math.random().toString(36).substring(2, 7),
            timestamp: now.getTime(),
            time: timeStr,
            name: customerName,
            total: currentTotal
        };

        let history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        const nowTime = now.getTime();
        history = history.filter(item => (nowTime - item.timestamp) < EXPIRATION_HOURS * 60 * 60 * 1000);

        history.unshift(record);
        localStorage.setItem("bar_dank_history", JSON.stringify(history));
        loadHistory();
    }

    function deleteHistoryItem(id) {
        if (!confirm("この履歴を削除してもよろしいですか？")) {
            return;
        }
        let history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        history = history.filter(item => item.id !== id);
        localStorage.setItem("bar_dank_history", JSON.stringify(history));
        loadHistory();
    }

    function clearAllHistory() {
        if (!confirm("すべての売上履歴を削除してもよろしいですか？この操作は元に戻せません。")) {
            return;
        }
        localStorage.removeItem("bar_dank_history");
        loadHistory();
    }

    // 時間を無視して履歴にある全売上を合計して表示する関数
    function showTotalSum() {
        let history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        
        let totalSum = 0;
        let totalCount = history.length;

        history.forEach(item => {
            totalSum += item.total;
        });

        alert(`【売上総合計】\n件数: ${totalCount}件\n合計金額: ¥${totalSum.toLocaleString()}`);
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem("bar_dank_history") || "[]");
        const listEl = document.getElementById("historyList");
        
        const nowTime = new Date().getTime();
        const validHistory = history.filter(item => (nowTime - item.timestamp) < EXPIRATION_HOURS * 60 * 60 * 1000);
        
        if (validHistory.length !== history.length) {
            localStorage.setItem("bar_dank_history", JSON.stringify(validHistory));
            history = validHistory;
        }

        if (history.length === 0) {
            listEl.innerHTML = `<div style="text-align: center; color: #555;">履歴はまだありません</div>`;
            return;
        }

        let html = "";
        history.forEach(item => {
            const itemId = item.id || item.timestamp;
            html += `
                <div class="history-item">
                    <div class="history-info">
                        <span>${item.time} - ${item.name}様</span>
                        <span style="color:var(--gold-light)">¥${item.total.toLocaleString()}</span>
                    </div>
                    <button class="history-delete-btn" onclick="deleteHistoryItem('${itemId}')">削除</button>
                </div>
            `;
        });
        listEl.innerHTML = html;
    }
</script>

</body>
